<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc Dix - Communauté & Règles RP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- En-Tête du Site -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider text-red-500">BLOC DIX</h1>
            <span id="role-badge" class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-full border border-slate-700">Visiteur</span>
        </div>
    </header>

    <!-- Corps Principal -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow">
        <!-- Section Publique: Règles et Mises à jour -->
        <section class="mb-8">
            <h2 class="text-2xl font-semibold mb-4 text-slate-100">📢 Actualités & Règles RP</h2>
            <div id="posts-container" class="space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <h3 class="font-bold text-red-400">Bienvenue sur Bloc Dix</h3>
                    <p class="text-slate-300 text-sm mt-1">Le site officiel de notre communauté. Retrouvez ici toutes les infos et les mises à jour du serveur.</p>
                </div>
            </div>
        </section>

        <!-- Section Panneau Admin -->
        <section class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700 mt-6">
            
            <div id="secret-login-box" class="space-y-3">
                <h3 class="text-sm font-semibold text-slate-400">🔐 Espace Réservé (Admin)</h3>
                <div class="flex gap-2">
                    <input type="text" id="secret-code-input" placeholder="Entrer le code secret..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-red-500">
                    <button onclick="checkSecretCode()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-3 rounded-xl transition text-sm">Entrer</button>
                </div>
            </div>

            <div id="admin-dashboard" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-bold text-emerald-400">🛠️ Panel Admin Activé</h2>
                    <button onclick="lockAdmin()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-lg transition">Verrouiller</button>
                </div>
                <textarea id="new-update-text" placeholder="Écrire une mise à jour ou une règle RP..." class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-emerald-500 h-24 text-sm"></textarea>
                <button onclick="publishUpdate()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded-xl transition text-sm">Publier sur le site</button>
            </div>
        </section>
    </main>

    <!-- Pied de page -->
    <footer class="bg-slate-900 border-t border-slate-800 text-center p-4 text-xs text-slate-500">
        &copy; 2026 Bloc Dix. Tous droits réservés.
    </footer>

    <script>
        // الكود السري الجديد هو: 1234
        const ADMIN_SECRET = "1234";

        function checkSecretCode() {
            const inputVal = document.getElementById('secret-code-input').value.trim();
            if (inputVal === ADMIN_SECRET) {
                document.getElementById('secret-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('role-badge').textContent = "Admin";
                document.getElementById('role-badge').className = "text-xs bg-emerald-950 text-emerald-400 px-2 py-1 rounded-full border border-emerald-800";
                alert("Bienvenue Boss ! Panel débloqué.");
            } else {
                alert("Code secret incorrect !");
            }
        }

        function lockAdmin() {
            document.getElementById('secret-login-box').classList.remove('hidden');
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('secret-code-input').value = '';
            document.getElementById('role-badge').textContent = "Visiteur";
            document.getElementById('role-badge').className = "text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-full border border-slate-700";
            alert("Panel verrouillé avec succès.");
        }

        function publishUpdate() {
            const text = document.getElementById('new-update-text').value;
            if(!text) return alert("Écris quelque chose d'abord !");
            
            const container = document.getElementById('posts-container');
            const newPost = document.createElement('div');
            newPost.className = "bg-slate-800 p-4 rounded-xl border border-slate-700 mt-2";
            newPost.innerHTML = `<h3 class="font-bold text-emerald-400">Mise à jour Admin</h3><p class="text-slate-300 text-sm mt-1">${text}</p>`;
            container.prepend(newPost);
            document.getElementById('new-update-text').value = '';
            alert("Publié avec succès !");
        }
    </script>
</body>
</html>
